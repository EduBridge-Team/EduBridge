# Taqat Academy / Nixpacks deployment for the EduBridge monorepo.
# DEPLOY_TARGET selects which app this Taqat service runs:
#   api (default) -> Laravel API
#   web           -> React/Vite frontend
#
# PostgreSQL client tools are installed so pg_dump/pg_restore/psql are
# available from the Taqat terminal for database migration and maintenance.

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "libpq", "postgresql_17", "nodejs_22"]

[phases.install]
cmds = ["bash deploy/taqat-install.sh"]

[phases.build]
cmds = ["bash deploy/taqat-build.sh"]

[start]
cmd = "bash deploy/taqat-start.sh"
