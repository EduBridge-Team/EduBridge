name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish latest Android release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(awk '/^version:/ {print $2; exit}' edubridge-app/pubspec.yaml)"
          if [ -z "$version_line" ]; then
            echo "::error::Unable to resolve Flutter app version from edubridge-app/pubspec.yaml"
            exit 1
          fi

          version_name="${version_line%%+*}"
          build_number="${version_line##*+}"
          tag="v${version_line}"
          title="EduBridge v${version_name} (Build ${build_number})"

          echo "version=$version_line" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Find matching successful Android build
        id: android_run
        shell: bash
        run: |
          set -euo pipefail

          expected="${{ steps.version.outputs.version }}"
          run_id=""

          while IFS=$'\t' read -r candidate_id candidate_sha candidate_created; do
            candidate_version="$(
              gh api "repos/${GITHUB_REPOSITORY}/contents/edubridge-app/pubspec.yaml?ref=${candidate_sha}" \
                --jq '.content' \
              | tr -d '\n' \
              | base64 --decode \
              | awk '/^version:/ {print $2; exit}'
            )"

            echo "Checking Android run ${candidate_id} (${candidate_created}) -> ${candidate_version:-unknown}"

            if [ "$candidate_version" = "$expected" ]; then
              run_id="$candidate_id"
              break
            fi
          done < <(
            gh run list \
              --workflow android-build.yml \
              --branch main \
              --status success \
              --limit 100 \
              --json databaseId,headSha,createdAt \
              --jq 'sort_by(.createdAt) | reverse[] | [.databaseId, .headSha, .createdAt] | @tsv'
          )

          if [ -z "$run_id" ]; then
            echo "::error::No successful Android build matching app version $expected was found on main."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using Android build workflow run $run_id for version $expected."

      - name: Download APK and AAB artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-artifacts release-files
          mkdir -p release-artifacts release-files

          gh run download "${{ steps.android_run.outputs.run_id }}" --dir release-artifacts

          apk="$(find release-artifacts -type f -name '*.apk' -print -quit)"
          aab="$(find release-artifacts -type f -name '*.aab' -print -quit)"

          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::APK artifact was not found in workflow run ${{ steps.android_run.outputs.run_id }}."
            exit 1
          fi

          if [ -z "$aab" ] || [ ! -f "$aab" ]; then
            echo "::error::AAB artifact was not found in workflow run ${{ steps.android_run.outputs.run_id }}."
            exit 1
          fi

          out_apk="release-files/EduBridge-${{ steps.version.outputs.version_name }}-build${{ steps.version.outputs.build_number }}.apk"
          out_aab="release-files/EduBridge-${{ steps.version.outputs.version_name }}-build${{ steps.version.outputs.build_number }}.aab"

          cp "$apk" "$out_apk"
          cp "$aab" "$out_aab"

          echo "apk=$out_apk" >> "$GITHUB_OUTPUT"
          echo "aab=$out_aab" >> "$GITHUB_OUTPUT"

      - name: Verify AAB version metadata
        shell: bash
        run: |
          set -euo pipefail

          python - "${{ steps.artifacts.outputs.aab }}" \
            "${{ steps.version.outputs.version_name }}" \
            "${{ steps.version.outputs.build_number }}" <<'PY'
          import sys
          import zipfile

          aab_path, expected_name, expected_code = sys.argv[1:]

          with zipfile.ZipFile(aab_path) as zf:
              manifest = zf.read("base/manifest/AndroidManifest.xml")

          def read_string_after(attribute: bytes) -> str:
              start = manifest.find(attribute)
              if start < 0:
                  raise SystemExit(f"Missing {attribute.decode()} in AAB manifest")

              marker = manifest.find(b"\x1a", start + len(attribute), start + len(attribute) + 96)
              if marker < 0 or marker + 1 >= len(manifest):
                  raise SystemExit(f"Unable to decode {attribute.decode()} from AAB manifest")

              length = manifest[marker + 1]
              value = manifest[marker + 2:marker + 2 + length]
              return value.decode("utf-8")

          actual_code = read_string_after(b"versionCode")
          actual_name = read_string_after(b"versionName")

          print(f"AAB versionName={actual_name}, versionCode={actual_code}")

          if actual_name != expected_name or actual_code != expected_code:
              raise SystemExit(
                  f"AAB metadata mismatch: expected {expected_name}+{expected_code}, "
                  f"got {actual_name}+{actual_code}"
              )
          PY

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## EduBridge Android Release

          Latest production Android build for EduBridge.

          - Version: `${{ steps.version.outputs.version_name }}`
          - Build number: `${{ steps.version.outputs.build_number }}`
          - Signed APK included for direct installation/testing.
          - Signed AAB included for Google Play Console distribution.
          - Android artifact metadata is verified before publishing.

          ### Verification

          Published from Android workflow run `${{ steps.android_run.outputs.run_id }}` whose source commit uses the same Flutter version as `main`.
          EOF

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "${{ steps.version.outputs.title }}" \
              --notes-file release-notes.md

            gh release upload "$tag" \
              "${{ steps.artifacts.outputs.apk }}" \
              "${{ steps.artifacts.outputs.aab }}" \
              --clobber
          else
            gh release create "$tag" \
              --target main \
              --title "${{ steps.version.outputs.title }}" \
              --notes-file release-notes.md \
              --latest \
              "${{ steps.artifacts.outputs.apk }}" \
              "${{ steps.artifacts.outputs.aab }}"
          fi

      - name: Show release
        shell: bash
        run: gh release view "${{ steps.version.outputs.tag }}" --json name,tagName,url,assets
