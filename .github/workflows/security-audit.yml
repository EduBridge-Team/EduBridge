name: Dependency security audit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-api-laravel
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

  npm-audit:
    name: npm vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --ignore-scripts
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
