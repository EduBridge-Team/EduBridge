name: Build Android APK and AAB

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "edubridge-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "edubridge-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: edubridge-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail

          ndk_version="28.2.13676358"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$sdk_root" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not configured."
            exit 1
          fi

          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi

          if [ -z "$sdkmanager_bin" ] || [ ! -x "$sdkmanager_bin" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          if [ -f "$sdk_root/ndk/$ndk_version/source.properties" ]; then
            echo "Android NDK $ndk_version is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing Android NDK $ndk_version (attempt $attempt/3)..."
            rm -rf "$sdk_root/ndk/$ndk_version"

            if "$sdkmanager_bin" "ndk;$ndk_version"; then
              if [ -f "$sdk_root/ndk/$ndk_version/source.properties" ]; then
                echo "Android NDK $ndk_version installed successfully."
                exit 0
              fi
            fi

            echo "::warning::Android NDK install attempt $attempt failed. Cleaning partial install before retry."
            rm -rf "$sdk_root/ndk/$ndk_version"
            sleep $((attempt * 5))
          done

          echo "::error::Failed to install Android NDK $ndk_version after 3 attempts."
          exit 1

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Prepare and verify release credentials
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          missing=0
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVER_CLIENT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Build unsigned release APK for pull request
        if: github.event_name == 'pull_request'
        run: flutter build apk --release

      - name: Build unsigned release AAB for pull request
        if: github.event_name == 'pull_request'
        run: flutter build appbundle --release

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Build signed release AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduBridge-APK-${{ github.run_number }}
          path: edubridge-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: EduBridge-AAB-${{ github.run_number }}
          path: edubridge-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
