name: Build Android APK and AAB

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "edubridge-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "edubridge-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: edubridge-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduBridge-APK-${{ github.run_number }}
          path: edubridge-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: EduBridge-AAB-${{ github.run_number }}
          path: edubridge-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
