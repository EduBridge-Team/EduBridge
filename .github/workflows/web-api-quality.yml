name: Web and API quality checks

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "edubridge-web/**"
      - "edubridge-api-laravel/**"
      - "edubridge-app/lib/services/api_service.dart"
      - "scripts/check_mobile_api_parity.py"
      - "deploy/**"
      - "Procfile"
      - "nixpacks.toml"
      - ".github/workflows/web-api-quality.yml"
      - ".github/workflows/branch-guard.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "edubridge-web/**"
      - "edubridge-api-laravel/**"
      - "edubridge-app/lib/services/api_service.dart"
      - "scripts/check_mobile_api_parity.py"
      - "deploy/**"
      - "Procfile"
      - "nixpacks.toml"
      - ".github/workflows/web-api-quality.yml"
      - ".github/workflows/branch-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-config:
    name: Deployment config syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate deployment scripts
        run: |
          bash -n deploy/*.sh
          node --check deploy/taqat-web-server.mjs

  mobile-api-contract:
    name: Flutter ↔ Laravel API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify Flutter API calls have Laravel routes
        run: python scripts/check_mobile_api_parity.py

  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Lint Laravel PHP files
        run: |
          find edubridge-api-laravel/app edubridge-api-laravel/routes edubridge-api-laravel/database/migrations \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  api-tests:
    name: Laravel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-api-laravel
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Laravel tests
        env:
          JWT_SECRET: ci-test-jwt-secret
        run: php artisan test

  web-build:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json
      - run: npm ci
      - name: Lint website
        run: npm run lint
      - name: Build website
        env:
          VITE_API_URL: /api
        run: npm run build
