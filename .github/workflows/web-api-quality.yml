name: Web and API quality checks

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "edubridge-web/**"
      - "edubridge-api-laravel/**"
      - ".github/workflows/web-api-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint Laravel PHP files
        run: |
          find edubridge-api-laravel/app edubridge-api-laravel/routes edubridge-api-laravel/database/migrations \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  web-build:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json
      - run: npm ci
      - name: Build website
        env:
          VITE_API_URL: /api
        run: npm run build
