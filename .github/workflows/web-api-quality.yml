name: Web and API quality checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      contract: ${{ steps.filter.outputs.contract }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          matches() {
            grep -Eq "$1" /tmp/changed-files.txt
          }

          web=false
          api=false
          app=false
          contract=false
          deploy=false

          if matches '^(edubridge-web/|\.github/workflows/web-api-quality\.yml$)'; then
            web=true
          fi

          if matches '^(edubridge-api-laravel/|\.github/workflows/web-api-quality\.yml$)'; then
            api=true
          fi

          if matches '^(edubridge-app/|\.github/workflows/web-api-quality\.yml$)'; then
            app=true
          fi

          if matches '^(edubridge-api-laravel/(app|routes)/|edubridge-app/lib/services/api[^/]*\.dart$|scripts/check_mobile_api_parity\.py$|\.github/workflows/web-api-quality\.yml$)'; then
            contract=true
          fi

          if matches '^(deploy/|scripts/test_api_runtime\.sh$|\.github/workflows/web-api-quality\.yml$)'; then
            deploy=true
          fi

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy-config:
    name: Deployment config syntax
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate deployment scripts
        run: |
          bash -n deploy/*.sh scripts/test_api_runtime.sh
          node --check deploy/web-server.mjs
          python3 -m unittest discover -s scripts -p test_noor_config.py

          cp edubridge-api-laravel/.env.example edubridge-api-laravel/.env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' edubridge-api-laravel/.env
          printf '%s\n' \
            'DB_HOST=edubridge-postgres' \
            'DB_PORT=5432' \
            'DB_DATABASE=edubridge' \
            'DB_USERNAME=edubridge' \
            'DB_PASSWORD=ci-compose-password' \
            >> edubridge-api-laravel/.env

          docker compose \
            --env-file edubridge-api-laravel/.env \
            -f deploy/oracle-compose.yml \
            config >/dev/null

          test -z "$(find edubridge-api-laravel/database -maxdepth 1 -name 'upgrade_*.sql' -print -quit)"
          test ! -e edubridge_schema.sql

          rm -f edubridge-api-laravel/.env

  mobile-api-contract:
    name: Flutter ↔ Laravel API contract
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.contract == 'true' || needs.changes.outputs.app == 'true'

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.contract == 'true'
        with:
          python-version: "3.12"

      - name: Verify Flutter API calls have Laravel routes
        if: needs.changes.outputs.contract == 'true'
        run: python scripts/check_mobile_api_parity.py

      - name: Set up Java 17
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        if: needs.changes.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK with retry
        if: needs.changes.outputs.app == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ndk_version="28.2.13676358"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$sdk_root" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not configured."
            exit 1
          fi

          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi

          if [ -z "$sdkmanager_bin" ] || [ ! -x "$sdkmanager_bin" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          if [ -f "$sdk_root/ndk/$ndk_version/source.properties" ]; then
            echo "Android NDK $ndk_version is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing Android NDK $ndk_version (attempt $attempt/3)..."
            rm -rf "$sdk_root/ndk/$ndk_version"

            if "$sdkmanager_bin" "ndk;$ndk_version"; then
              if [ -f "$sdk_root/ndk/$ndk_version/source.properties" ]; then
                echo "Android NDK $ndk_version installed successfully."
                exit 0
              fi
            fi

            echo "::warning::Android NDK install attempt $attempt failed. Cleaning partial install before retry."
            rm -rf "$sdk_root/ndk/$ndk_version"
            sleep $((attempt * 5))
          done

          echo "::error::Failed to install Android NDK $ndk_version after 3 attempts."
          exit 1

      - name: Install Flutter dependencies
        if: needs.changes.outputs.app == 'true'
        working-directory: edubridge-app
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Analyze Flutter code
        if: needs.changes.outputs.app == 'true'
        working-directory: edubridge-app
        run: flutter analyze

      - name: Run Flutter tests
        if: needs.changes.outputs.app == 'true'
        working-directory: edubridge-app
        run: flutter test

      - name: Build unsigned release APK
        if: needs.changes.outputs.app == 'true'
        working-directory: edubridge-app
        run: flutter build apk --release

      - name: Build unsigned release AAB
        if: needs.changes.outputs.app == 'true'
        working-directory: edubridge-app
        run: flutter build appbundle --release

      - name: No mobile or API contract changes
        if: needs.changes.outputs.contract != 'true' && needs.changes.outputs.app != 'true'
        run: echo "No Flutter/Laravel contract or mobile changes; required check passes."

  php-syntax:
    name: PHP syntax details
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.api == 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.outputs.api == 'true'
        with:
          php-version: "8.4"
      - name: Lint Laravel PHP files
        if: needs.changes.outputs.api == 'true'
        run: |
          find edubridge-api-laravel/app edubridge-api-laravel/routes edubridge-api-laravel/database/migrations \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: No API PHP changes
        if: needs.changes.outputs.api != 'true'
        run: echo "No Laravel changes; PHP syntax detail job passes."

  api-tests:
    name: Laravel unit and feature tests
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-api-laravel
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.api == 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.outputs.api == 'true'
        with:
          php-version: "8.4"
          coverage: none
      - name: Install Composer dependencies
        if: needs.changes.outputs.api == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked PHP dependencies
        if: needs.changes.outputs.api == 'true'
        run: composer audit --locked --no-interaction
      - name: Prepare test environment
        if: needs.changes.outputs.api == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Laravel tests
        if: needs.changes.outputs.api == 'true'
        env:
          JWT_SECRET: ci-test-jwt-secret
        run: php artisan test
      - name: No API changes
        if: needs.changes.outputs.api != 'true'
        working-directory: .
        run: echo "No Laravel changes; unit/feature test detail job passes."

  postgres-migration-smoke:
    name: Fresh PostgreSQL migration
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: edubridge_test
          POSTGRES_USER: edubridge
          POSTGRES_PASSWORD: edubridge-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edubridge -d edubridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: edubridge-api-laravel
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare PostgreSQL environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate an empty PostgreSQL database
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: edubridge_test
          DB_USERNAME: edubridge
          DB_PASSWORD: edubridge-ci-password
          SESSION_DRIVER: file
          JWT_SECRET: ci-test-jwt-secret
        run: php artisan migrate:fresh --force
      - name: Verify fresh schema
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: edubridge_test
          DB_USERNAME: edubridge
          DB_PASSWORD: edubridge-ci-password
          SESSION_DRIVER: file
          JWT_SECRET: ci-test-jwt-secret
        run: php artisan test --filter=FreshPostgresMigrationTest

  api-runtime-smoke:
    name: Production API container
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: edubridge_runtime_ci
          POSTGRES_USER: edubridge_ci
          POSTGRES_PASSWORD: isolated-runtime-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edubridge_ci -d edubridge_runtime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Build production API image
        run: docker build -t edubridge-api-ci edubridge-api-laravel
      - name: Verify production container
        run: |
          set -o pipefail
          bash scripts/test_api_runtime.sh edubridge-api-ci 2>&1 | tee api-runtime-smoke.log
      - name: Upload API runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-runtime-smoke-${{ github.run_id }}
          path: api-runtime-smoke.log
          if-no-files-found: error
          retention-days: 3

  api-required-gate:
    name: Laravel tests
    needs:
      - changes
      - api-tests
      - postgres-migration-smoke
      - api-runtime-smoke
      - deploy-config
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce API and deployment quality gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
          API_TESTS_RESULT: ${{ needs.api-tests.result }}
          MIGRATION_RESULT: ${{ needs.postgres-migration-smoke.result }}
          RUNTIME_RESULT: ${{ needs.api-runtime-smoke.result }}
          DEPLOY_RESULT: ${{ needs.deploy-config.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Changed-area detection failed."
            exit 1
          fi

          if [ "$API_CHANGED" = "true" ]; then
            [ "$API_TESTS_RESULT" = "success" ] || { echo "::error::Laravel unit/feature tests failed or were cancelled."; exit 1; }
            [ "$MIGRATION_RESULT" = "success" ] || { echo "::error::Fresh PostgreSQL migration smoke failed or was cancelled."; exit 1; }
            [ "$RUNTIME_RESULT" = "success" ] || { echo "::error::Production API container smoke failed or was cancelled."; exit 1; }
          fi

          if [ "$DEPLOY_CHANGED" = "true" ]; then
            [ "$DEPLOY_RESULT" = "success" ] || { echo "::error::Deployment config validation failed or was cancelled."; exit 1; }
            [ "$RUNTIME_RESULT" = "success" ] || { echo "::error::Production API container smoke failed or was cancelled."; exit 1; }
          fi

          echo "Required API/deployment quality gate passed."

  php-required-gate:
    name: PHP syntax
    needs:
      - changes
      - php-syntax
      - api-required-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PHP and API quality gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          PHP_RESULT: ${{ needs.php-syntax.result }}
          API_GATE_RESULT: ${{ needs.api-required-gate.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Changed-area detection failed."
            exit 1
          fi

          if [ "$API_CHANGED" = "true" ] && [ "$PHP_RESULT" != "success" ]; then
            echo "::error::PHP syntax validation failed or was cancelled."
            exit 1
          fi

          if [ "$API_GATE_RESULT" != "success" ]; then
            echo "::error::API/deployment quality gate failed or was cancelled."
            exit 1
          fi

          echo "Required PHP/API quality gate passed."

  web-build:
    name: React production build
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-web
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.web == 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json
      - name: Install web dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci
      - name: Audit high and critical web dependency vulnerabilities
        if: needs.changes.outputs.web == 'true'
        run: npm audit --audit-level=high
      - name: Lint website
        if: needs.changes.outputs.web == 'true'
        run: npm run lint
      - name: Test website navigation and lazy routes
        if: needs.changes.outputs.web == 'true'
        run: npm test
      - name: Build website
        if: needs.changes.outputs.web == 'true'
        env:
          VITE_API_URL: /api
        run: npm run build
      - name: No web changes
        if: needs.changes.outputs.web != 'true'
        working-directory: .
        run: echo "No web changes; required React build check passes."
