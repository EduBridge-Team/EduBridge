name: Web and API quality checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      contract: ${{ steps.filter.outputs.contract }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          matches() {
            grep -Eq "$1" /tmp/changed-files.txt
          }

          web=false
          api=false
          contract=false
          deploy=false

          if matches '^(edubridge-web/|\.github/workflows/web-api-quality\.yml$)'; then
            web=true
          fi

          if matches '^(edubridge-api-laravel/|\.github/workflows/web-api-quality\.yml$)'; then
            api=true
          fi

          if matches '^(edubridge-api-laravel/(app|routes)/|edubridge-app/lib/services/api_service\.dart$|scripts/check_mobile_api_parity\.py$|\.github/workflows/web-api-quality\.yml$)'; then
            contract=true
          fi

          if matches '^(deploy/|\.github/workflows/web-api-quality\.yml$)'; then
            deploy=true
          fi

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy-config:
    name: Deployment config syntax
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate deployment scripts
        run: |
          bash -n deploy/*.sh
          node --check deploy/web-server.mjs

          cp edubridge-api-laravel/.env.example edubridge-api-laravel/.env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' edubridge-api-laravel/.env
          printf '%s\n' \
            'DB_HOST=edubridge-postgres' \
            'DB_PORT=5432' \
            'DB_DATABASE=edubridge' \
            'DB_USERNAME=edubridge' \
            'DB_PASSWORD=ci-compose-password' \
            >> edubridge-api-laravel/.env

          docker compose \
            --env-file edubridge-api-laravel/.env \
            -f deploy/oracle-compose.yml \
            config >/dev/null

          test -z "$(find edubridge-api-laravel/database -maxdepth 1 -name 'upgrade_*.sql' -print -quit)"
          test ! -e edubridge_schema.sql

          rm -f edubridge-api-laravel/.env

  mobile-api-contract:
    name: Flutter ↔ Laravel API contract
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.contract == 'true'
      - uses: actions/setup-python@v6
        if: needs.changes.outputs.contract == 'true'
        with:
          python-version: "3.12"
      - name: Verify Flutter API calls have Laravel routes
        if: needs.changes.outputs.contract == 'true'
        run: python scripts/check_mobile_api_parity.py
      - name: No API contract changes
        if: needs.changes.outputs.contract != 'true'
        run: echo "No Flutter/Laravel contract changes; required check passes."

  php-syntax:
    name: PHP syntax
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.api == 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.outputs.api == 'true'
        with:
          php-version: "8.4"
      - name: Lint Laravel PHP files
        if: needs.changes.outputs.api == 'true'
        run: |
          find edubridge-api-laravel/app edubridge-api-laravel/routes edubridge-api-laravel/database/migrations \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: No API PHP changes
        if: needs.changes.outputs.api != 'true'
        run: echo "No Laravel changes; required PHP syntax check passes."

  api-tests:
    name: Laravel tests
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-api-laravel
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.api == 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.outputs.api == 'true'
        with:
          php-version: "8.4"
          coverage: none
      - name: Install Composer dependencies
        if: needs.changes.outputs.api == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test environment
        if: needs.changes.outputs.api == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Laravel tests
        if: needs.changes.outputs.api == 'true'
        env:
          JWT_SECRET: ci-test-jwt-secret
        run: php artisan test
      - name: No API changes
        if: needs.changes.outputs.api != 'true'
        working-directory: .
        run: echo "No Laravel changes; required Laravel tests check passes."


  postgres-migration-smoke:
    name: Fresh PostgreSQL migration
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: edubridge_test
          POSTGRES_USER: edubridge
          POSTGRES_PASSWORD: edubridge-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edubridge -d edubridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: edubridge-api-laravel
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare PostgreSQL environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate an empty PostgreSQL database
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: edubridge_test
          DB_USERNAME: edubridge
          DB_PASSWORD: edubridge-ci-password
          SESSION_DRIVER: file
          JWT_SECRET: ci-test-jwt-secret
        run: php artisan migrate:fresh --force
      - name: Verify fresh schema
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: edubridge_test
          DB_USERNAME: edubridge
          DB_PASSWORD: edubridge-ci-password
          SESSION_DRIVER: file
          JWT_SECRET: ci-test-jwt-secret
        run: php artisan test --filter=FreshPostgresMigrationTest

  web-build:
    name: React production build
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubridge-web
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.web == 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json
      - name: Install web dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci
      - name: Lint website
        if: needs.changes.outputs.web == 'true'
        run: npm run lint
      - name: Build website
        if: needs.changes.outputs.web == 'true'
        env:
          VITE_API_URL: /api
        run: npm run build
      - name: No web changes
        if: needs.changes.outputs.web != 'true'
        run: echo "No web changes; required React build check passes."
