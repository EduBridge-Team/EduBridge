# Temporary branch-only workflow: regenerate the npm lockfile in GitHub's networked runner.
# Delete this file before merging the build-system change into main.
name: Experimental web lockfile bootstrap

on:
  push:
    branches:
      - fix/web-esbuild-audit-20261118
    paths:
      - '.github/workflows/web-lockfile-bootstrap-20261118.yml'
      - 'edubridge-web/package.json'
      - 'edubridge-web/scripts/build-web.mjs'
      - 'edubridge-web/tests/school-operations.test.mjs'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor == 'MohammedEmad333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Regenerate dependency lockfile without running install scripts
        working-directory: edubridge-web
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Check lockfile and dependency audit
        working-directory: edubridge-web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit only regenerated lockfile to experiment branch
        run: |
          set -eu
          git add -- edubridge-web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(web): regenerate audited esbuild lockfile'
          git push origin HEAD:fix/web-esbuild-audit-20261118
