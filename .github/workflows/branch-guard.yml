name: Branch guard

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" != "main" ]]; then
            echo "Unsupported PR target branch: '$BASE_REF'."
            exit 1
          fi

          case "$HEAD_REF" in
            feature/*|fix/*|hotfix/*|chore/*|refactor/*|docs/*)
              echo "OK: '$HEAD_REF' is allowed to merge into main."
              exit 0
              ;;
            *)
              echo "PRs into 'main' must come from feature/*, fix/*, hotfix/*, chore/*, refactor/*, or docs/*, not '$HEAD_REF'."
              exit 1
              ;;
          esac
