name: Refresh web lockfile

on:
  push:
    branches:
      - fix/ci-security-android
    paths:
      - ".github/workflows/refresh-web-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: fix/ci-security-android
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json

      - name: Refresh vulnerable transitive dependency
        working-directory: edubridge-web
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- edubridge-web/package-lock.json; then
            echo "No lockfile changes generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edubridge-web/package-lock.json
          git commit -m "fix(web): refresh patched npm lockfile"
          git push origin HEAD:fix/ci-security-android
