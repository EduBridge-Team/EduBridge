name: Build deployable website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json

      - name: Rebuild HQ transparent hero asset
        run: |
          cat edubridge-web/.hero-parts/hero.*.b64 | tr -d '\n\r' | base64 -d > edubridge-web/public/edubridge-hero-child.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('edubridge-web/public/edubridge-hero-child.webp')
          data = p.read_bytes()
          assert len(data) > 50000, f'Hero asset is unexpectedly small: {len(data)} bytes'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Invalid WebP hero asset'
          print(f'HQ hero ready: {len(data)} bytes')
          PY

      - name: Install and build
        working-directory: edubridge-web
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy-artifact
          mkdir -p deploy-artifact/web
          cp -R edubridge-web/dist/. deploy-artifact/web/
          cp deploy-artifact/web/index.html deploy-artifact/web/app.html
          rm -f deploy-artifact/web/index.html

          # Laravel owns the document-root .htaccess in the legacy deployment.
          rm -f deploy-artifact/web/.htaccess

      - name: Upload legacy deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: EduBridge-Web-Deploy-${{ github.run_number }}
          path: deploy-artifact/web
          if-no-files-found: error
          retention-days: 30
