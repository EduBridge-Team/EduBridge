name: Build deployable website

on:
  push:
    branches:
      - redesign/brand-identity-2026
    paths:
      - 'edubridge-web/**'
      - '.github/workflows/web-deploy-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json

      - name: Install and build
        working-directory: edubridge-web
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy/web/assets
          mkdir -p deploy/web/assets
          cp edubridge-web/dist/index.html deploy/web/app.html
          cp -R edubridge-web/dist/assets/. deploy/web/assets/
          cp edubridge-web/dist/edubridge-logo.png deploy/web/edubridge-logo.png
          cp edubridge-web/dist/edubridge-icon.png deploy/web/edubridge-icon.png

      - name: Commit deploy bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/web
          if git diff --cached --quiet; then
            echo 'Deploy bundle is already current.'
            exit 0
          fi
          git commit -m 'build(web): refresh deploy bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
