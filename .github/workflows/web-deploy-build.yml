name: Build deployable website

on:
  push:
    branches:
      - main
    paths:
      - 'edubridge-web/**'
      - '.github/workflows/web-deploy-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json

      - name: Rebuild HQ transparent hero asset
        run: |
          cat edubridge-web/.hero-parts/hero.*.b64 | tr -d '\n\r' | base64 -d > edubridge-web/public/edubridge-hero-child.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('edubridge-web/public/edubridge-hero-child.webp')
          data = p.read_bytes()
          assert len(data) > 50000, f'Hero asset is unexpectedly small: {len(data)} bytes'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Invalid WebP hero asset'
          print(f'HQ hero ready: {len(data)} bytes')
          PY

      - name: Install and build
        working-directory: edubridge-web
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Prepare deploy bundle
        run: |
          # Copy the complete Vite output, including every file from public/.
          # This prevents newly added hero/brand images from disappearing in production.
          rm -rf deploy/web
          mkdir -p deploy/web
          cp -R edubridge-web/dist/. deploy/web/
          cp deploy/web/index.html deploy/web/app.html
          rm -f deploy/web/index.html

      - name: Commit deploy bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/web
          if git diff --cached --quiet; then
            echo 'Deploy bundle is already current.'
            exit 0
          fi
          git commit -m 'build(web): refresh deploy bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
