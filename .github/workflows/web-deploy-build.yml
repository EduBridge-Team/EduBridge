name: Build deployable website

on:
  push:
    branches:
      - main
    paths:
      - 'edubridge-web/**'
      - '.github/workflows/web-deploy-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: edubridge-web/package-lock.json

      - name: Rebuild HQ transparent hero asset
        run: |
          cat edubridge-web/.hero-parts/hero.*.b64 | tr -d '\n\r' | base64 -d > edubridge-web/public/edubridge-hero-child.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('edubridge-web/public/edubridge-hero-child.webp')
          data = p.read_bytes()
          assert len(data) > 50000, f'Hero asset is unexpectedly small: {len(data)} bytes'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Invalid WebP hero asset'
          print(f'HQ hero ready: {len(data)} bytes')
          PY

      - name: Install and build
        working-directory: edubridge-web
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Prepare deploy bundle
        run: |
          # Build the deployable snapshot outside the Git worktree. The branch may
          # advance while Vite is building, so generated files must not participate
          # in a merge/rebase.
          rm -rf /tmp/edubridge-deploy-web
          mkdir -p /tmp/edubridge-deploy-web
          cp -R edubridge-web/dist/. /tmp/edubridge-deploy-web/
          cp /tmp/edubridge-deploy-web/index.html /tmp/edubridge-deploy-web/app.html
          rm -f /tmp/edubridge-deploy-web/index.html
          # Laravel owns the document-root .htaccess. Never bundle the SPA
          # FallbackResource file, otherwise /api requests fail at Apache level.
          rm -f /tmp/edubridge-deploy-web/.htaccess

      - name: Commit deploy bundle
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # API-only commits can advance main while this job is building. Always
          # apply the generated bundle on top of the newest main instead of
          # rebasing generated assets, which can create content conflicts.
          for attempt in 1 2 3; do
            echo "Deploy push attempt ${attempt}/3"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            rm -rf deploy/web
            mkdir -p deploy/web
            cp -R /tmp/edubridge-deploy-web/. deploy/web/

            git add deploy/web
            if git diff --cached --quiet; then
              echo 'Deploy bundle is already current.'
              exit 0
            fi

            git commit -m 'build(web): refresh deploy bundle'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo 'main advanced during push; retrying on the newest head...'
          done

          echo 'Unable to publish deploy bundle after 3 attempts.'
          exit 1
