worker_processes auto;
pid /tmp/edubridge-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/edubridge-nginx/client_body;
    proxy_temp_path /tmp/edubridge-nginx/proxy;
    fastcgi_temp_path /tmp/edubridge-nginx/fastcgi;
    uwsgi_temp_path /tmp/edubridge-nginx/uwsgi;
    scgi_temp_path /tmp/edubridge-nginx/scgi;

    # Signed download URLs contain credentials: do not log their query strings.
    map $request_uri $request_path {
        ~^([^?]*) $1;
        default /;
    }
    log_format api '$remote_addr "$request_method $request_path $server_protocol" $status $body_bytes_sent $request_time';
    access_log /dev/stdout api;
    server_tokens off;
    sendfile on;

    # Bound idle/slow clients so they cannot hold worker connections indefinitely.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    server {
        listen 8081;
        root /app/public;
        index index.php;

        # Lesson media supports files up to 150 MiB. Keep only a small multipart
        # overhead allowance instead of accepting the previous 384 MiB bodies.
        client_max_body_size 170m;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/tmp/edubridge-php.sock;
            fastcgi_read_timeout 185s;
            fastcgi_buffering off;
        }

        location ~* \.php(?:/|$) {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
