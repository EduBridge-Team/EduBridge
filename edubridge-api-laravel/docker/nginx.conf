user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Signed download URLs contain credentials: do not log their query strings.
    map $request_uri $request_path {
        ~^([^?]*) $1;
        default /;
    }
    log_format api '$remote_addr "$request_method $request_path $server_protocol" $status $body_bytes_sent $request_time';
    access_log /dev/stdout api;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8081;
        root /app/public;
        index index.php;
        client_max_body_size 384m;
        client_body_timeout 180s;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/run/edubridge-php.sock;
            fastcgi_read_timeout 185s;
            fastcgi_buffering off;
        }

        location ~* \.php(?:/|$) {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
