services:
  postgres:
    image: postgres:17
    container_name: edubridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - edubridge-postgres-data:/var/lib/postgresql/data
    networks:
      - edubridge-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../edubridge-api-laravel
      dockerfile: Dockerfile
    image: edubridge-api:latest
    container_name: edubridge-api
    restart: unless-stopped
    env_file:
      - ../edubridge-api-laravel/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://api.edubridge.win
      DB_CONNECTION: pgsql
      DB_HOST: edubridge-postgres
      DB_PORT: "5432"
      SESSION_DRIVER: file
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - edubridge-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$body=@file_get_contents("http://127.0.0.1:8081/"); exit($body === false ? 1 : 0);'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/oracle-web.Dockerfile
      args:
        VITE_API_URL: /api
    image: edubridge-web:latest
    container_name: edubridge-web
    restart: unless-stopped
    environment:
      PORT: "8080"
      TAQAT_API_ORIGIN: https://api.edubridge.win
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'fetch("http://127.0.0.1:8080/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  edubridge-net:
    external: true

volumes:
  edubridge-postgres-data:
    external: true
