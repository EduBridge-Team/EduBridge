name: edubridge_app
description: EduBridge — تطبيق تعليمي لأطفال ذوي الاحتياجات الخاصة
publish_to: 'none'
version: 1.4.1+7

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.7.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  speech_to_text: ^7.0.0
  video_player: ^2.8.0
  url_launcher: ^6.2.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_tts: ^4.2.0   # قراءة محتوى الدروس صوتياً (accessibility)
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  audioplayers: ^6.1.0
  web_socket_channel: ^2.4.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # أصول الهوية المستخدمة فعلياً داخل التطبيق
  assets:
    - assets/brand_icon.png
    - assets/brand_logo.png
    - assets/2.png
    - assets/1.png
    - assets/3.png
    - assets/shape_circle.png
    - assets/shape_infinity.png
    - assets/shape_cap.png
    - assets/letter_1_E.png
    - assets/letter_2_d.png
    - assets/letter_3_u.png
    - assets/letter_4_B.png
    - assets/letter_5_r.png
    - assets/letter_6_i.png
    - assets/letter_7_d.png
    - assets/letter_8_g.png
    - assets/letter_9_e.png
    








    