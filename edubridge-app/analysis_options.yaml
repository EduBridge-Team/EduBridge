# Static analysis settings for the Flutter application only.
# Keep the recommended flutter_lints baseline, and add focused checks that
# catch avoidable control-flow mistakes and async resource leaks.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_empty_else: true
    avoid_void_async: true
    cancel_subscriptions: true
    close_sinks: true
    no_duplicate_case_values: true
    valid_regexps: true
